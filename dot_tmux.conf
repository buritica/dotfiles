# tmux — managed by chezmoi

# Ghostty's terminal advertises true colour; tell tmux, and use tmux's own
# terminfo when this host has it (macOS's system ncurses may not).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features 'xterm-ghostty:RGB'
set -as terminal-features 'xterm-256color:RGB'
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# No lag on Escape (vim), more scrollback, mouse for scroll/select/resize.
set -s escape-time 10
set -g history-limit 50000
set -g mouse on
set -g focus-events on

# Copy over SSH/mosh reaches the local clipboard via OSC 52.
set -s set-clipboard on

# Windows and panes count from 1, and close gaps when one closes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window titles follow the host and session.
set -g set-titles on
set -g set-titles-string '#h: #S'

# Splits and new windows open in the current pane's directory.
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# prefix-r reloads this file.
bind r source-file ~/.tmux.conf \; display 'tmux.conf reloaded'

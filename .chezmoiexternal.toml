# External resources managed by chezmoi.
# Pinned (not a branch) so a shell can't silently change on the next apply. The
# two zsh-users plugins match team-perrito/estanli's dotfiles role
# (dotfiles_omz_plugins); zsh-defer cuts no tags, so it's pinned to a commit.
# Bump by editing the URL.

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/0.8.0.tar.gz"
    exact = true
    stripComponents = 1

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v0.7.1.tar.gz"
    exact = true
    stripComponents = 1

[".oh-my-zsh/custom/plugins/zsh-defer"]
    type = "archive"
    url = "https://github.com/romkatv/zsh-defer/archive/53a26e287fbbe2dcebb3aa1801546c6de32416fa.tar.gz"
    exact = true
    stripComponents = 1

# Oh My Zsh itself, at the same commit team-perrito/estanli's dotfiles role pins
# (dotfiles_omz_version); bump both together, this one first (estanli's
# omz-pin workflow compares its pin to this file on master, daily and on its
# PRs). Upstream cuts no tags. Exact, so a
# bump also removes files upstream deleted (oh-my-zsh.sh globs lib/*.zsh) and
# the .git of an old installer clone; the plugin externals above nest inside it,
# and omz.zsh keeps OMZ's cache in ~/.cache/oh-my-zsh. Anything else put in
# ~/.oh-my-zsh/custom by hand is removed: add it as an external here instead.
[".oh-my-zsh"]
    type = "archive"
    exact = true
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/0650a250405af1e480b1ecf8c33bc960b9f333f5.tar.gz"
    stripComponents = 1

name: ci

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          ignore_paths: .git .github

      # ubuntu runners ship without zsh, which skips test.sh's zsh-base
      # checks (syntax + shared history settings) silently.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Set execute permissions on test.sh
        run: chmod +x ./test.sh

      - name: Run tests
        run: ./test.sh

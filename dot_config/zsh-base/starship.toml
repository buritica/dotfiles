# starship prompt for every account that loads the shared zsh base (omz.zsh
# points STARSHIP_CONFIG here). Kept short on purpose: dir git:(branch) $,
# with user@host in front over SSH (or as root / another user), plus an
# in-progress merge/rebase, background jobs and the exit status when there
# are any. No clock, git dirty/untracked markers or command duration: they
# read as noise ("[00:46:53] ... ? 13s") and weren't useful.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
format = """
${env_var.ZSH_PROMPT_EMOJI}\
($username$hostname:)\
$directory\
$git_branch\
$git_state\
$jobs\
$status\
$character"""

# Per-host emoji, set by the account's .zshrc (buritica: from chezmoi's hostname).
[env_var.ZSH_PROMPT_EMOJI]
format = "$env_value "

[username]
show_always = false  # over SSH, as root, or as a user other than the one logged in
format = "[$user]($style)"
style_user = "cyan"
style_root = "bold red"

[hostname]
ssh_only = true
format = "@[$hostname]($style)"
style = "bold blue"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "green"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[git:\\($branch\\)]($style) "
style = "yellow"

[status]
disabled = false
format = "[✘$status]($style) "  # last exit code; the ✘ says it isn't output

[character]
success_symbol = "[\\$](bold white)"
error_symbol = "[\\$](bold red)"
